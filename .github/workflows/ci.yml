name: CI - Sonar e Push da imagem

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  # Imagem no Docker Hub: docker.io/<usuario>/front-aula-12
  IMAGE_NAME: docker.io/${{ secrets.DOCKER_USERNAME }}/front-aula-12
  # Tag Ãºnica por commit
  IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/front-aula-12:${{ github.sha }}

jobs:
  sonar:
    name: AnÃ¡lise SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_PROJECT_NAME: ${{ vars.SONAR_PROJECT_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histÃ³rico completo: blame e detecÃ§Ã£o de cÃ³digo novo

      - name: Validar configuraÃ§Ã£o do Sonar
        run: |
          faltando=0
          for nome in SONAR_TOKEN SONAR_ORGANIZATION SONAR_PROJECT_KEY SONAR_PROJECT_NAME; do
            if [ -z "${!nome}" ]; then
              echo "::error::$nome nÃ£o configurado (Settings > Secrets and variables > Actions)"
              faltando=1
            fi
          done
          exit $faltando

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: front
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            "-Dsonar.projectName=${{ vars.SONAR_PROJECT_NAME }}"

  build:
    name: Build e Push
    runs-on: ubuntu-latest
    needs: sonar
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      # Em pull request a imagem sÃ³ Ã© construÃ­da, sem push
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar credenciais do Docker Hub
        run: |
          faltando=0
          for nome in DOCKER_USERNAME DOCKER_PASSWORD; do
            if [ -z "${!nome}" ]; then
              echo "::error::Secret $nome nÃ£o configurado (Settings > Secrets and variables > Actions)"
              faltando=1
            fi
          done
          exit $faltando

      - name: Login no Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da imagem
        run: docker build -t "$IMAGE" -t "$IMAGE_NAME:latest" front

      - name: Push para o Docker Hub
        if: env.PUSH == 'true'
        run: |
          docker push "$IMAGE"
          docker push "$IMAGE_NAME:latest"
          {
            echo "### Imagem publicada"
            echo "- \`$IMAGE\`"
            echo "- \`$IMAGE_NAME:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"